<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venta mudanza</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl flex-col gap-3 px-4 py-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Venta por mudanza</h1>
          <p class="text-sm text-slate-500">Muebles y cosas del piso, con precio directo aqui</p>
          <p class="text-xs text-slate-400">* Todos los precios mostrados son por unidad.</p>
        </div>
        <div class="flex w-full items-center gap-2 md:w-auto">
          <input
            id="searchInput"
            type="search"
            placeholder="Buscar por nombre..."
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100 md:w-auto"
          />
          <button
            id="favoritesToggle"
            type="button"
            class="relative rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
            aria-label="Ver favoritos"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span id="favoritesBadge" class="absolute -right-2 -top-2 hidden rounded-full bg-red-500 px-1.5 py-0.5 text-xs font-bold text-white"></span>
          </button>
          <button
            id="filterToggle"
            type="button"
            class="md:hidden rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
            aria-label="Abrir filtros"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
          </button>
        </div>
      </div>
      <div
        id="filtersPanel"
        class="hidden border-t border-slate-200 bg-slate-50/50 px-4 py-3 md:hidden md:border-t-0 md:bg-transparent md:p-0"
      >
        <div class="grid gap-2 grid-cols-2 md:flex md:gap-0">
          <select
            id="areaFilter"
            class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          >
            <option value="">Todas las areas (0)</option>
          </select>
          <select
            id="statusFilter"
            class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          >
            <option value="disponible" selected>Disponible</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
            <option value="">Todos</option>
          </select>
          <select
            id="sortFilter"
            class="col-span-2 md:col-span-1 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          >
            <option value="id">Área y nombre (A-Z)</option>
            <option value="priceAsc">Precio menor primero</option>
            <option value="priceDesc">Precio mayor primero</option>
            <option value="nameAsc">Nombre A-Z</option>
          </select>
        </div>
      </div>
      <div
        id="filtersPanelDesktop"
        class="hidden md:block border-t border-slate-200 bg-white/50 px-4 py-3"
      >
        <div class="mx-auto flex w-full max-w-6xl gap-2">
          <select
            id="areaFilterDesktop"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100 md:w-auto"
          >
            <option value="">Todas las areas (0)</option>
          </select>
          <select
            id="statusFilterDesktop"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100 md:w-auto"
          >
            <option value="disponible" selected>Disponible</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
            <option value="">Todos</option>
          </select>
          <select
            id="sortFilterDesktop"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100 md:w-auto"
          >
            <option value="id">Área y nombre (A-Z)</option>
            <option value="priceAsc">Precio menor primero</option>
            <option value="priceDesc">Precio mayor primero</option>
            <option value="nameAsc">Nombre A-Z</option>
          </select>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl px-4 py-6">
      <div class="mb-4 flex items-center justify-between">
        <p id="countLabel" class="text-sm text-slate-500"></p>
      </div>

      <div id="itemsGrid" class="grid grid-cols-2 gap-3 md:gap-4 lg:grid-cols-3"></div>
    </main>

    <template id="itemCardTemplate">
      <article class="item-card overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition md:hover:shadow-md group">
        <div class="relative aspect-square bg-slate-100 md:aspect-[4/3] overflow-hidden">
          <img class="item-image hidden h-full w-full object-cover  group-hover:scale-105 duration-300" alt="" />
          <div class="item-image-placeholder absolute inset-0 flex flex-col items-center justify-center gap-2 bg-slate-200 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="M21 15l-4.5-4.5L8 19"></path>
            </svg>
            <span class="text-xs font-medium">Imagen aun no disponible</span>
          </div>
          <div class="absolute left-2 top-2 rounded-full bg-white/90 px-2 py-1 text-xs font-semibold text-slate-700 hidden">
            #<span class="item-id"></span>
          </div>
          <div class="item-photos-badge absolute right-2 top-2 hidden rounded-full bg-black/65 px-2 py-1 text-xs font-medium text-white"></div>
          <button class="item-favorite-btn absolute left-2 top-2 rounded-full bg-white/90 backdrop-blur p-2 text-slate-600 hover:bg-white transition hover:text-red-500 active:scale-95" title="Agregar a favoritos">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
        </div>
        <div class="space-y-3 p-3 md:p-4">
          <div class="space-y-1">
            <h2 class="item-name text-base font-semibold leading-tight md:text-lg"></h2>
            <div class="flex flex-wrap gap-1.5">
              <span class="item-area inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600"></span>
              <span class="item-status inline-flex rounded-full px-2 py-0.5 text-xs font-medium"></span>
            </div>
          </div>
          <div class="space-y-1 text-sm">
            <p class="rounded-lg bg-emerald-50 px-2 py-1 text-emerald-700">
              <span>Precio aqui (ud):</span>
              <span class="item-here-price ml-1 text-base font-bold"></span>
            </p>
            <p class="rounded-lg bg-slate-50 px-2 py-1">
              <span class="text-slate-500">Unidades:</span>
              <span class="item-units font-medium"></span>
            </p>
            <p class="item-size-row rounded-lg bg-slate-50 px-2 py-1">
              <span class="text-slate-500">Medidas:</span>
              <span class="item-size font-medium"></span>
            </p>
          </div>
          <a
            class="item-link inline-flex w-full items-center justify-center rounded-xl bg-sky-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-sky-700"
            target="_blank"
            rel="noopener noreferrer"
          >
            Ver en Wallapop
          </a>
        </div>
      </article>
    </template>

    <div id="galleryModal" class="fixed inset-0 z-50 hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="absolute inset-0 bg-slate-900/70" data-modal-close="true"></div>
      <div class="relative mx-auto flex h-full w-full max-w-6xl items-center p-3 md:p-6">
        <section class="relative w-full overflow-hidden rounded-2xl bg-white shadow-2xl">
          <header class="flex items-start justify-between border-b border-slate-200 px-4 py-3 md:px-5">
            <div>
              <h2 id="modalTitle" class="text-lg font-semibold text-slate-900"></h2>
              <p id="modalMeta" class="text-sm text-slate-500"></p>
            </div>
            <button
              id="modalClose"
              type="button"
              class="rounded-lg border border-slate-300 px-2 py-1 text-sm font-medium text-slate-700 hover:bg-slate-50"
              data-modal-close="true"
            >
              Cerrar
            </button>
          </header>

          <div class="grid gap-4 p-4 md:grid-cols-[minmax(0,1fr)_280px] md:p-5">
            <div class="space-y-2">
              <div class="relative overflow-hidden rounded-xl bg-slate-100">
                <img id="modalMainImage" class="h-[52vh] w-full object-contain md:h-[60vh]" alt="" />
                <div id="modalImagePlaceholder" class="absolute inset-0 hidden flex flex-col items-center justify-center gap-3 bg-slate-200 text-slate-500">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-4.5-4.5L8 19"></path>
                  </svg>
                  <span class="text-sm font-medium">Imagen no disponible</span>
                </div>
                <button
                  id="modalPrev"
                  type="button"
                  class="absolute left-2 top-1/2 -translate-y-1/2 rounded-full bg-black/60 px-3 py-2 text-sm font-semibold text-white hover:bg-black/75"
                >
                  ‹
                </button>
                <button
                  id="modalNext"
                  type="button"
                  class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-black/60 px-3 py-2 text-sm font-semibold text-white hover:bg-black/75"
                >
                  ›
                </button>
              </div>
              <p id="modalCounter" class="text-xs text-slate-500"></p>
            </div>

            <aside class="space-y-3">
              <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-xs uppercase tracking-wide text-slate-500">Precio aqui (por unidad)</p>
                <p id="modalHerePrice" class="text-xl font-bold text-green-600"></p>
              </div>
              <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-xs uppercase tracking-wide text-slate-500">Precio Wallapop (por unidad)</p>
                <p id="modalWallapopPrice" class="text-xl font-bold text-sky-700"></p>
              </div>
              <div id="modalDescriptionRow" class="hidden rounded-xl bg-slate-50 p-3">
                <p class="text-xs uppercase tracking-wide text-slate-500">Descripcion</p>
                <p id="modalDescription" class="mt-1 text-sm text-slate-700"></p>
              </div>
              <a
                id="modalWallapop"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex w-full items-center justify-center rounded-xl bg-sky-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-sky-700"
              >
                Ver en Wallapop
              </a>
              <button
                id="modalFavoriteBtn"
                type="button"
                class="w-full rounded-xl border-2 border-red-300 bg-white px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50"
              >
                ♥ Agregar a favoritos
              </button>
              <div id="modalThumbs" class="grid grid-cols-4 gap-2 sm:grid-cols-6 md:grid-cols-3"></div>
            </aside>
          </div>
          <footer class="flex items-center justify-between border-t border-slate-200 px-4 py-3 md:px-5">
            <button
              id="modalPrevProduct"
              type="button"
              class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
            >
              ← Anterior
            </button>
            <p id="modalProductCounter" class="text-xs text-slate-500"></p>
            <button
              id="modalNextProduct"
              type="button"
              class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
            >
              Siguiente →
            </button>
          </footer>
        </section>
      </div>
    </div>

    <div id="favoritesModal" class="fixed inset-0 z-50 hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="favoritesModalTitle">
      <div class="absolute inset-0 bg-slate-900/70" data-modal-close="true"></div>
      <div class="relative mx-auto flex h-full w-full max-w-3xl items-center justify-center p-3 md:p-6">
        <section class="relative w-full overflow-hidden rounded-2xl bg-white shadow-2xl max-h-[90vh] flex flex-col">
          <header class="border-b border-slate-200 px-4 py-4 md:px-6">
            <div class="flex items-center justify-between">
              <div>
                <h2 id="favoritesModalTitle" class="text-2xl font-bold text-slate-900">Mi lista de productos</h2>
                <p id="favoritesCount" class="mt-1 text-sm text-slate-500">0 productos</p>
              </div>
              <button
                id="favoritesModalClose"
                type="button"
                class="rounded-lg border border-slate-300 px-2 py-1 text-sm font-medium text-slate-700 hover:bg-slate-50"
                data-modal-close="true"
              >
                ✕
              </button>
            </div>
          </header>

          <div id="favoritesListContainer" class="overflow-y-auto flex-1 px-4 py-4 md:px-6">
            <div id="favoritesList" class="grid gap-4 md:grid-cols-2"></div>
          </div>

          <footer class="border-t border-slate-200 bg-slate-50 px-4 py-4 md:px-6 space-y-3">
            <div class="flex items-center justify-between rounded-lg bg-white p-4 border border-slate-200">
              <div>
                <p class="text-sm text-slate-600">Presupuesto total:</p>
                <p id="favoritesTotal" class="text-3xl font-bold text-green-600">0€</p>
              </div>
              <div id="shareButtonContainer">
                <button
                  id="shareButton"
                  type="button"
                  class="rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 active:scale-95"
                >
                  📋 Copiar lista
                </button>
              </div>
            </div>
          </footer>
        </section>
      </div>
    </div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
